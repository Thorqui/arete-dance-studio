<div class="user-shell-container" style="background: linear-gradient(rgba(13,13,26,0.85), rgba(13,13,26,0.85)), url('assets/bg/student_bg.jpg') center/cover fixed; min-height: 100vh;">
    <!-- Top App Bar Clasic -->
    <header class="p-3 text-center d-flex justify-content-between align-items-center border-bottom"
        style="background-color: var(--md-surface); border-color: var(--md-overlay) !important;">
        <div class="d-flex align-items-center gap-2">
            <img src="assets/brand/isotipo.png" alt="Icono" style="height: 35px; width: auto; object-fit: contain;">
            <img src="assets/brand/logotipo_leyenda.png" alt="Arete Dance Studio" style="height: 25px; width: auto; object-fit: contain;">
        </div>
        <a href="/" class="text-white text-decoration-none">
            <i class="fa fa-home"></i> Portada
        </a>
    </header>

    <!-- Router Outlet Area (Main Content) -->
    <main class="content-scroll pb-5 mb-5">
        <router-outlet></router-outlet>
    </main>

    <!-- Bottom Navigation Bar a-la Flutter -->
    <nav class="bottom-nav" style="background-color: var(--md-surface); border-top: 1px solid var(--md-overlay);">
        <a routerLink="/app/classes" routerLinkActive="active" class="nav-item">
            <i class="fa fa-calendar"></i>
            <span>Clases</span>
        </a>
        <a routerLink="/app/chat" routerLinkActive="active" class="nav-item">
            <i class="fa fa-comments"></i>
            <span>Soporte</span>
        </a>
        <a routerLink="/app/videos" routerLinkActive="active" class="nav-item">
            <i class="fa fa-play-circle"></i>
            <span>Vídeos</span>
        </a>
        <a routerLink="/app/events" routerLinkActive="active" class="nav-item">
            <i class="fa fa-map-marker"></i>
            <span>Eventos</span>
        </a>
        <a routerLink="/app/profile" routerLinkActive="active" class="nav-item">
            <i class="fa fa-user"></i>
            <span>Perfil</span>
        </a>
    </nav>
</div>
