<div class="container mt-5 text-center text-white">
  <h2>Selecciona tu Perfil</h2>
  <p class="mb-4">Este es un inicio de sesión de prueba para la PWA de Arete.</p>

  <div class="d-flex justify-content-center gap-3">
    <button class="btn btn-outline-light btn-lg" (click)="loginAs('user')">
      Soy Usuario
    </button>
    
    <button class="btn btn-success btn-lg" (click)="loginAs('admin')">
      Soy Administrador
    </button>
  </div>
</div>
