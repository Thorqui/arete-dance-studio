<!-- ============================================================
     SCHEDULE - Horarios de clases
     Tabla con el horario semanal de la academia.
     Para añadir o cambiar horas/clases, edita los <td> de la tabla.
     ============================================================ -->
<section id="schedule" class="schedule-section">
  <div class="schedule-container">
    <!-- CABECERA -->
    <div class="schedule-header">
      <div class="section-line"></div>
      <p class="section-overline">{{ cms.scheduleData()?.overline || 'Planifica tu semana' }}</p>
      <h2 class="section-title">
        {{ cms.scheduleData()?.title || 'Nuestros' }}
        <span class="accent">{{ cms.scheduleData()?.accent || 'horarios.' }}</span>
      </h2>
    </div>

    <div class="table-wrapper">
      <table class="schedule-table" aria-label="Horario semanal de clases">
        <thead>
          <tr>
            <th class="time-col">Hora</th>
            <th *ngFor="let weekday of weekdays">{{ weekday }}</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let time of times">
            <th class="time-col" scope="row">{{ time }}</th>
            <td
              class="class-cell"
              [class.has-class]="classesAt(day, time).length"
              *ngFor="let weekday of weekdays; let day = index"
            >
              <div class="class-entry" *ngFor="let lesson of classesAt(day, time)">
                <strong class="class-time" *ngIf="lesson.time !== time">{{ lesson.time }}</strong>
                <span class="class-level" *ngIf="lesson.level">{{ lesson.level }}</span>
                <strong class="class-name">{{ lesson.name }}</strong>
                <small *ngIf="lesson.teacherIds.length">{{ teacherNames(lesson).join(' y ') }}</small>
              </div>
              <span class="no-class" *ngIf="!classesAt(day, time).length">—</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
